# Keep newly published dependencies out of the verified install.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
shellEmulator: true

packages:
  - 'packages/*'
  - 'examples/*'
  - docs

# GHSA-238p-pmpm-9mq7: the Markdown linter still requests vulnerable KaTeX.
overrides:
  micromark-extension-math>katex: ^0.19.0
